# The instrumented suite needs a device, so it cannot run on every push without
# making every push slow. Nightly, and on demand.
#
# This is where the UI tests live -- the ones that drive a real Activity and
# assert that a tap writes a row. They are also the slowest and the most likely
# to be flaky on an emulator, which is the reason they are not gating merges
# yet. Promote them to the push workflow once they have been quiet for a while.
name: Instrumented

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  androidTest:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86_64 emulator usable rather than glacial.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # minSdk is 33 (READ_MEDIA_IMAGES does not exist before it), so the
      # emulator image cannot be older than that.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore
