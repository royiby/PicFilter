org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true

# Leave the app installed after ./gradlew connectedDebugAndroidTest.
#
# The default is to uninstall both APKs when the run finishes, and
# uninstalling takes /data/data with it: the enrolled people, the clusters,
# the scores, the promotion rows and every human label. That cost a hand-tagged
# enrolment and a 4.5-minute bootstrap once, and it cost the face crops on
# every run since -- about forty seconds of face detection to rebuild each
# time, plus a database restore to get the rest back.
#
# The tests do not need the uninstall. Every one of them opens its own
# throwaway database by name (Db(ctx, name)) precisely so it never touches the
# real one.
android.injected.androidTest.leaveApksInstalledAfterRun=true
